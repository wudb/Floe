name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # Liquid Glass is gated on the link SDK, not the run-time OS: building
    # with Xcode <=16 keeps the legacy appearance even on Tahoe, so CI must
    # build with the Xcode 26+ SDK like local builds do. macos-14 runners
    # (Xcode 16 max) are deprecated.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode 26 SDK
        run: |
          ls -d /Applications/Xcode*.app
          PINNED="/Applications/Xcode_26.6.app"
          if [ -d "$PINNED" ]; then
            XCODE="$PINNED"
          else
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "${XCODE:-}" ]; then
            echo "No Xcode 26+ found on runner"
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --show-sdk-version --sdk macosx)"
      - name: Check release pipeline rules
        run: python3 script/tests/release-pipeline.py
      - name: Build and verify Universal release
        env:
          FLOE_RELEASE_TAG: ${{ github.ref_name }}
        run: ./script/build.sh "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ github.ref_name }}/Floe.zip
            release/${{ github.ref_name }}/Floe.dmg
            release/${{ github.ref_name }}/SHA256SUMS.txt
            release/${{ github.ref_name }}/build-info.json
          fail_on_unmatched_files: true
          generate_release_notes: true
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    # 只有配置 Floe 自己的 tap 后才发布 Homebrew 元数据。
    if: ${{ vars.FLOE_HOMEBREW_TAP != '' && !contains(github.ref, '-') }}
    steps:
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Get SHA256 from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "SHA256=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.assets[] | select(.name == "Floe.zip") | .digest' \
            | sed 's/sha256://')" >> $GITHUB_ENV
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FLOE_HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update cask
        run: |
          cat > homebrew-tap/Casks/floe.rb << 'EOF'
          cask "floe" do
            version "${{ env.VERSION }}"
            sha256 "${{ env.SHA256 }}"

            url "${{ github.server_url }}/${{ github.repository }}/releases/download/v#{version}/Floe.zip"
            name "Floe"
            desc "Free and open-source menu bar manager for macOS"
            homepage "${{ github.server_url }}/${{ github.repository }}"

            depends_on macos: :sonoma
            app "Floe.app"

            zap trash: [
              "~/Library/Preferences/com.float.floe.plist",
            ]

            caveats <<~EOS
              Floe is ad-hoc signed. On first launch, right-click the app and choose Open.
              After every update, re-grant Accessibility and Screen Recording in
              System Settings > Privacy & Security (see ${{ github.server_url }}/${{ github.repository }}).
            EOS
          end
          EOF
      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/floe.rb
          git diff --cached --quiet || git commit -m "floe ${{ env.VERSION }}"
          git push
# After the Release finishes, publish the appcast so installed apps see it:
#   ./script/update-appcast.sh <tag> --key <private-key.pem>
# Configure FLOE_RELEASES_REPO, SUFeedURL and SUPublicEDKey for Floe first.
# ponytail: ad-hoc signing is for internal testing only, public releases need Developer ID + notarization
