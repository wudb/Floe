name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # Liquid Glass is gated on the link SDK, not the run-time OS: building
    # with Xcode <=16 keeps the legacy appearance even on Tahoe, so CI must
    # build with the Xcode 26+ SDK like local builds do. macos-14 runners
    # (Xcode 16 max) are deprecated.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 SDK
        run: |
          ls -d /Applications/Xcode*.app
          PINNED="/Applications/Xcode_26.6.app"
          if [ -d "$PINNED" ]; then
            XCODE="$PINNED"
          else
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "${XCODE:-}" ]; then
            echo "No Xcode 26+ found on runner"
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --show-sdk-version --sdk macosx)"
      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must look like vX.Y.Z (e.g. v0.11.13)"
            exit 1
          fi
          # Sparkle requires the build number to keep increasing and it must
          # stay above 1117 (the last build released upstream).
          BUILD_NUMBER=$((1117 + GITHUB_RUN_NUMBER))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Building version $VERSION ($BUILD_NUMBER)"
      - name: Build app
        run: |
          xcodebuild -project Floe.xcodeproj -scheme Floe -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean build
          BUILD_DIR=$(xcodebuild -project Floe.xcodeproj -scheme Floe -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -showBuildSettings 2>/dev/null \
            | sed -n 's/^ *BUILT_PRODUCTS_DIR *= *//p' | head -1)
          echo "APP_PATH=$BUILD_DIR/Floe.app" >> $GITHUB_ENV
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
      - name: Zip and publish to GitHub Release
        run: |
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" Floe.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Floe.zip
          generate_release_notes: true
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    # 只有配置 Floe 自己的 tap 后才发布 Homebrew 元数据。
    if: ${{ vars.FLOE_HOMEBREW_TAP != '' && !contains(github.ref, '-') }}
    steps:
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Get SHA256 from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "SHA256=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.assets[] | select(.name == "Floe.zip") | .digest' \
            | sed 's/sha256://')" >> $GITHUB_ENV
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FLOE_HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update cask
        run: |
          cat > homebrew-tap/Casks/floe.rb << 'EOF'
          cask "floe" do
            version "${{ env.VERSION }}"
            sha256 "${{ env.SHA256 }}"

            url "${{ github.server_url }}/${{ github.repository }}/releases/download/v#{version}/Floe.zip"
            name "Floe"
            desc "Free and open-source menu bar manager for macOS"
            homepage "${{ github.server_url }}/${{ github.repository }}"

            depends_on macos: :sonoma
            app "Floe.app"

            zap trash: [
              "~/Library/Preferences/com.wudb.Floe.plist",
            ]

            caveats <<~EOS
              Floe is ad-hoc signed. On first launch, right-click the app and choose Open.
              After every update, re-grant Accessibility and Screen Recording in
              System Settings > Privacy & Security (see ${{ github.server_url }}/${{ github.repository }}).
            EOS
          end
          EOF
      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/floe.rb
          git diff --cached --quiet || git commit -m "floe ${{ env.VERSION }}"
          git push
# After the Release finishes, publish the appcast so installed apps see it:
#   ./script/update-appcast.sh <tag> --key <private-key.pem>
# Configure FLOE_RELEASES_REPO, SUFeedURL and SUPublicEDKey for Floe first.
# ponytail: ad-hoc signing is for internal testing only, public releases need Developer ID + notarization
