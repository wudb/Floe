<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floe · App Icon 候选</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #edf0f6; color: #20273b; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width: 1080px; margin: auto; padding: 36px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  h1 { font-size: 27px; letter-spacing: -.7px; margin: 0 0 8px; }
  p { margin: 0; color: #6a7489; line-height: 1.6; font-size: 14px; }
  button { border: 1px solid #cbd2df; border-radius: 20px; padding: 9px 16px; background: transparent; color: inherit; cursor: pointer; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
  article { background: #fff; border: 1px solid #dce1ea; border-radius: 24px; padding: 24px; }
  .hero { display: flex; align-items: center; justify-content: center; height: 264px; }
  .hero img { width: 256px; height: 256px; object-fit: contain; }
  h2 { font-size: 19px; margin: 18px 0 6px; }
  h2 span { color: #3578ef; margin-right: 10px; }
  .sizes { margin-top: 20px; border-top: 1px solid #e9ecf2; padding-top: 16px; display: flex; gap: 22px; align-items: center; }
  .sample { display: flex; align-items: center; gap: 8px; color: #7e889a; font-size: 12px; }
  .sample img { object-fit: contain; }
  footer { margin-top: 22px; color: #7e889a; font-size: 12px; }
  body.dark { background: #151922; color: #f1f4fc; }
  .dark article { background: #212733; border-color: #343d4e; }
  .dark p { color: #a2aec3; }
  .dark .sizes { border-color: #343d4e; }
  .dark button { border-color: #46516a; }
  @media (max-width: 680px) { main { padding: 20px; } .grid { grid-template-columns: 1fr; } header { align-items: flex-start; } }
</style>
<main>
  <header><div><h1>Floe · 四种图标方向</h1><p>A 为原图焕新，B 保留刚设计的版本，C / D 为新的方向。</p></div><button onclick="document.body.classList.toggle('dark')">切换浅 / 深背景</button></header>
  <div class="grid">
    <article><div class="hero"><img src="a-frosted-cube.png" alt="A 冰晶立方"></div><h2><span>A</span>冰晶立方</h2><p>延续原有立方体，更新玻璃材质与光影。</p><div class="sizes"><div class="sample"><img src="a-frosted-cube.png" width="32" height="32" alt="">32 px</div><div class="sample"><img src="a-frosted-cube.png" width="64" height="64" alt="">64 px</div></div></article>
    <article><div class="hero"><img src="b-floating-f.png" alt="B 悬浮 F"></div><h2><span>B</span>悬浮 F</h2><p>保留刚设计的蓝底冰白 F，突出品牌首字母。</p><div class="sizes"><div class="sample"><img src="b-floating-f.png" width="32" height="32" alt="">32 px</div><div class="sample"><img src="b-floating-f.png" width="64" height="64" alt="">64 px</div></div></article>
    <article><div class="hero"><img src="c-organized-bars.png" alt="C 秩序浮条"></div><h2><span>C</span>秩序浮条</h2><p>浅色底与蓝色浮条，呼应菜单栏整理功能。</p><div class="sizes"><div class="sample"><img src="c-organized-bars.png" width="32" height="32" alt="">32 px</div><div class="sample"><img src="c-organized-bars.png" width="64" height="64" alt="">64 px</div></div></article>
    <article><div class="hero"><img src="d-floating-floe.png" alt="D 浮冰叠层"></div><h2><span>D</span>浮冰叠层</h2><p>深靛底与悬浮冰片，呼应 Floe 的名字。</p><div class="sizes"><div class="sample"><img src="d-floating-floe.png" width="32" height="32" alt="">32 px</div><div class="sample"><img src="d-floating-floe.png" width="64" height="64" alt="">64 px</div></div></article>
  </div>
  <footer>候选设计 · 点击右上角按钮比较浅色与深色背景 · 待选定后定稿</footer>
</main>
</html>
